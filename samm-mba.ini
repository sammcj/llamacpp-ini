version = 1

; MacBook Air M1 (16 GB) llama-server router defaults.
;
; Same key format as samm-mbp.ini (llama-server long-arg names without the
; leading dashes). Precedence: CLI args > per-model [section] > this [*].
;
; This machine has 16 GB of unified memory, so every value here trades context
; length and cache RAM down from the M5 Max preset to leave headroom for the
; weights. Run small models only. The size-tier that upgrades KV cache for
; sub-40 GB models is disabled on this host (SIZE_SMALL_KV_GB=0 in samm-mba.env)
; so small models keep the memory-cheap q8_0 KV below, instead of f16/bf16.

[*]

; --- Context -----------------------------------------------------------
ctx-size            = 16384  ; 16K; raise per-model if a model needs more and fits
ctx-checkpoints     = 8      ; default 32; kept low to cap checkpoint RAM
; Minimum token spacing between checkpoints (default 8192). At 16K ctx the
; default only ever allows 2 checkpoints, so the budget of 8 above is unusable.
checkpoint-min-step = 4096

; --- KV cache quantisation (memory-cheap; not upgraded on this host) ----
cache-type-k = q8_0
cache-type-v = q8_0

; --- Slots / offload / threads ----------------------------------------
; parallel: left at the -1 (auto) default. See samm-mbp.ini for the reasoning -
; auto means 4 slots + kv_unified, each slot seeing the full ctx-size from one
; shared buffer, so pinning 1 no longer buys context or KV memory.
; parallel   = 1
gpu-layers   = all         ; unified memory + --fit (on by default) caps the fit
threads      = 4           ; M1 has 4 performance cores

; --- Router / fit ------------------------------------------------------
models-max = 2             ; default 4; 4 resident models will not fit in 16 GB
; Memory --fit leaves free per device, MiB (default 1024). 1 GiB of headroom on
; a 16 GB machine is gone as soon as a browser is open.
fit-target = 2048

; --- Prompt cache RAM budget, MiB (default 8192 = 8 GiB) ---------------
cache-ram = 2048           ; 2 GiB; the M5 Max uses 16 GiB - too large here
cache-reuse = 256          ; default 0; reuse partial cache hits via KV shifting

; --- Sampling ----------------------------------------------------------
temp = 0.6                 ; default 0.8

; --- Speculative decoding: built-in MTP, ON by default ------------------
; Same wiring as the M5 Max preset; see samm-mbp.ini for the full explanation.
; sync-models.py writes the per-model spec-draft-model / spec-type overrides
; into .generated/router.ini on top of this base.
spec-type         = draft-mtp
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0

; --- Per-model overrides --------------------------------------------------
; To register a model outside --models-dir, or override a model's draft/ctx,
; add a section (see samm-mbp.ini for the format).
