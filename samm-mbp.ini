version = 1

; M5 Max (128 GB) llama-server router defaults.
;
; Keys are llama-server long-argument names without the leading dashes
; (e.g. --n-gpu-layers -> n-gpu-layers). Short forms and LLAMA_ARG_* env
; names also work as keys.
;
; Precedence: CLI args > per-model [section] > this global [*] section.
;
; Deliberately NOT set here because they are already the llama-server
; defaults: cache-prompt (on), jinja (on for the server), --host 127.0.0.1,
; and --fit on. Router-only flags (--models-dir, --models-preset,
; --sleep-idle-seconds, --host) live in run-llama-server.sh, not here.

[*]

metrics = 1                 ; default 0 (off); enable Prometheus metrics endpoint

; --- Context -----------------------------------------------------------
ctx-size        = 153600   ; 150K context; sync-models.py drops to 131072 (128K) for models >80 GB
ctx-checkpoints = 64       ; default 32; sync-models.py drops this to 32 for models >80 GB

; --- KV cache quantisation (default f16 for both) ----------------------
; sync-models.py overrides KV for models under 40 GB (bf16 for Qwen, f16 for others);
; larger models keep q8_0.
cache-type-k = q8_0
cache-type-v = q8_0

; --- Slots / offload / threads ----------------------------------------
; parallel: left at the -1 (auto) default. Auto now means 4 slots AND
; kv_unified = true, under which each slot sees the full ctx-size out of one
; shared KV buffer. Pinning 1 used to buy back context because ctx-size was
; divided per slot; that division is gone, so pinning 1 gains no context and no
; KV memory, does not speed up single-stream decode, and costs slot reuse -
; 4 slots keep four conversation prefixes hot instead of evicting on every
; switch. Caveat: unified KV shares one ctx-size pool, so two genuinely
; concurrent long requests contend; solo that never fires.
; Measured 2026-09-02 (build 9359): parallel 1 vs auto is tg 50.12 vs 50.05 with
; acceptance unchanged, so the auto default costs nothing for single-stream decode.
; Not a clean read on slot count alone: auto also turns kv-unified on, so the 1-slot
; arm changed two things. And it does not clear issue #27572 (acceptance collapse
; under concurrent requests) - the sweep ran one request at a time. See QWEN_NEXT.md.
; parallel   = 1
gpu-layers   = all         ; default -1 (auto); force every layer onto the GPU
; threads      = 16          ; default -1 (auto = all cores)
threads-batch = 18 ; might help with prompt processing
; Low scheduling priority: free on an idle machine, but under contention the
; OS preempts inference threads before foreground apps (keeps the UI smooth).

; These can help if the machine lags up while inferring, but might impact performance as a tradeoff
; prio = -1          ; default 0 (normal)
; poll = 0

; --- Router: concurrently resident models (default 4) ------------------
; Router-global only (no per-model override exists). Was 2, but the two big
; Qwen grafts (60 + 77 GB working sets) evict each other's page cache when
; both are resident - measured as Q4KXL dropping to ~20 t/s in real use vs
; ~30+ benchmarked solo. One resident model keeps the active one warm.
models-max = 1

; --- Model loading (default auto = mmap) -------------------------------
; mlock keeps weights resident so macOS cannot compress or page them out.
; Caveat: with a model near the memory ceiling this makes the whole file
; wired; drop back to `auto` if the machine starts thrashing on 80 GB+ models.
; load-mode = mmap+mlock

; --- Prompt cache RAM budget, MiB (default 8192 = 8 GiB) ---------------
cache-ram = 16384          ; 16 GiB
; Reuse partial prompt-cache hits via KV shifting (default 0 = off). Helps
; agent/editor traffic where the prefix shifts rather than growing.
cache-reuse = 256

; --- Sampling ----------------------------------------------------------
temp = 0.6                 ; default 0.8

; --- Reasoning ---------------------------------------------------------
; Cap thinking length (default -1 = unrestricted). When the budget is hit the
; message below is injected just before the end-of-thinking tag, so the model
; closes its trace and answers instead of being cut mid-thought. No-op on
; models without a thinking template. Override per model with a [section].
reasoning-budget         = 8192
reasoning-budget-message = You have approached your thinking budget. Please answer the question.
; Keep the thinking trace in the whole history, not just the last assistant
; message. Only templates advertising supports_preserve_reasoning honour it;
; the rest keep their own default. Without it the server nags at model load.
reasoning-preserve       = 1
; Split <think> traces into the OpenAI reasoning_content field instead of
; streaming them as raw text tokens, which stalls tool-calling clients.
reasoning-format         = deepseek

; --- Speculative decoding: MTP + ngram combo, ON by default (default none) --
; MTP works two ways depending on the model:
;   - Embedded (e.g. Qwen 3.5/3.6/3.8): the full GGUF carries nextn weights and
;     the server self-drafts from the model itself - this global flag is enough.
;   - Separate head (e.g. Gemma 4): the full model has no nextn weights; a small
;     MTP head GGUF must be loaded as `spec-draft-model` (was `model-draft`).
; Enabling draft-mtp on a model with neither aborts its load. So sync-models.py
; probes every GGUF and writes per-model overrides into .generated/router.ini
; (the preset the launcher passes): `spec-draft-model = <head>` for base+head models.
; Generative models with no MTP get `spec-type = ngram-mod` only; embedding
; models get `spec-type = none` (no speculation). The local --models-dir scanner
; does no MTP discovery itself; the `mtp-` sibling trick is -hf only.
;
spec-default       = 1
; spec-type takes a comma list, but do NOT add ngram-mod alongside draft-mtp:
; draftless ngram has priority per step, so wherever it matches it displaces
; the MTP head's higher-acceptance drafts. Measured on Qwen3.8-Flash-Next
; (~90% MTP acceptance): -4 t/s short context and on echo-heavy agent traffic,
; neutral at depth (see QWEN_NEXT.md). Non-MTP models get ngram-mod via their
; generated per-model sections instead.
spec-type          = draft-mtp
spec-draft-n-max   = 5
spec-draft-backend-sampling = 1
; draft KV cache quant; applies to the MTP draft context (default f16).
; cache-type-k-draft = q8_0
; cache-type-v-draft  = q8_0
; only draft when the model is confident (default 0.00 = ungated).
; The highest-value knob on this model: ungating measured tg 43.59 vs 50.05 and
; acceptance 0.42 vs 0.73 (build 9359). Drafting while unconfident costs real
; throughput rather than merely wasting a cheap attempt.
spec-draft-p-min = 0.7
; ngram-mod draft pool tuning (defaults: n-match 24, n-min 48, n-max 64)
; spec-ngram-mod-n-match = 24
; spec-ngram-mod-n-min = 24
; spec-ngram-mod-n-max = 86

; --- Per-model overrides --------------------------------------------------
; To register a model that lives outside --models-dir, or to point a model
; at a different draft/MTP setting, add a section. If the name matches a
; model the router already knows, the section just overrides its defaults;
; otherwise give it an absolute model path:
;
; [my-custom-model]
; model     = /Users/samm/.lmstudio/models/bytkim/some-model-Q8_0.gguf
; spec-type = none

; --- DFlash2 example: Qwen3.8-27B (llama.cpp PR #27342, merged 2026-08-27) ---
; DFlash2 = block-diffusion speculative drafting: a separate ~2B draft GGUF
; (arch = dflash) drafts a whole block per forward pass from the target's
; hidden states. No new flags - it reuses spec-type/spec-draft-model, and
; v1 vs v2 is auto-detected from the draft GGUF. spec-draft-n-max is clamped
; to the draft's trained block size (8 for this checkpoint). sync-models.py
; keeps arch=dflash files out of the farm, so drafts are wired manually here.
;
; Draft: huggingface.co/z-lab/Qwen3.8-27B-DFlash2-GGUF (use z-lab, not
; incoai - incoai GGUFs converted before 2026-08-27 are broken). Named
; section + explicit model path so it never collides with the farm's
; auto-generated Qwen3.8-27B sections, which self-draft via embedded MTP.
;
; Benched 2026-08-30 (M5 Max, ~450-token prompt, temp 1.0): DFlash2 34.1 t/s
; (acceptance 0.69, mean len 4.47); the inherited spec-draft-p-min 0.7 beat
; an explicit p-min 0 by ~2 t/s, so leave p-min alone. Embedded MTP on the
; same model: 36.7 t/s at n-max 3, 37.9 at n-max 4 + backend sampling (now
; written by sync-models.py for embedded-MTP Qwen 3.8 models); 5 and 6 were
; slower. Plain decode is ~19-20 t/s (23GB dense, bandwidth-bound), so both
; sit near the PR's own ~1.8x M5 numbers. MTP wins and needs no extra 2GB
; resident draft - section kept commented as a working reference.
; n-max 8 clamps to 7 (the trained block size 8 includes the anchor slot).
;
; [Qwen3.8-27B-DFlash2]
; model            = /Users/samm/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q6_K_L.gguf
; spec-type        = draft-dflash
; spec-draft-model = /Users/samm/.lmstudio/models/z-lab/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q8_0.gguf
; spec-draft-n-max = 7
; cache-type-k     = bf16
; cache-type-v     = bf16
; chat-template-file = /Users/samm/git/Qwen-Fixed-Chat-Templates/chat_template.jinja
; temp             = 1.0
; top-k            = 20
; min-p            = 0.0
; tags             = UD-Q6_K_L,DFlash2

; Qwen3.8-Flash-Next with the MTP head grafted on as a 4th split (see
; graft-mtp-head.py). Lives directly in --models-dir, so no model path here.
; draft-mtp for qwen4exp needs the llama.cpp PR #27836 build; samm-mbp.env
; points LLAMA_SERVER_BIN at the ~/git/llama.cpp-pr27836 worktree until the
; PR merges. Measured (M5 Max, n=200 code prompt): 41.6 t/s plain ->
; ~70 t/s with draft-mtp (inherited from [*]; ngram-mod deliberately absent,
; see the [*] spec-type comment).

;; Commenting out for now as is too slow compared to IQ4_XS
; [Qwen3.8-Flash-Next-MTP-Q4KXL-Merged-GGUF]
; ; UD-Q4_K_XL graft (104GB file, ~77GB non-PLE). MUST stay mmap (no mlock):
; ; wiring 104GB starves the OS. Benchmarking incomplete - loads lag the
; ; machine while the page cache is cold; see QWEN_NEXT.md.
; ; Override global mmap+mlock which forces all weights into memory, saves the ngram table usage
; load-mode = mmap
; spec-draft-n-max = 6
; spec-draft-backend-sampling = 1
; ; +16% prefill at 32K, TG unchanged; costs ~1.1GiB extra compute buffer
; ubatch-size = 2048
; tags = UD-Q4_K_XL,MTP
; ctx-checkpoints  = 32
; ctx-size         = 131072
; chat-template-file = /Users/samm/git/Qwen-Fixed-Chat-Templates/chat_template.jinja
; temp             = 1.0
; top-k            = 20
; min-p            = 0.0

[Qwen3.8-Flash-Next-MTP-Merged-GGUF]
; The global cache-reuse does NOT apply here - the server logs "cache_reuse is
; not supported by this context, it will be disabled" at load. This arch's
; recurrent/GDN state cannot be KV-shifted, so partial prefix reuse is off no
; matter what the global says. Nothing to set; noted so it is not assumed live.
;
; No mlock for this model: the large ngram table (per_layer_token_embd, ~27GB
; in IQ4_XS) is
; lazy-read upstream (madvise RANDOM, pages fault in on demand) and mlock
; wires the whole mapping, defeating it. Plain mmap keeps ~50GB unwired with
; no measured speed cost (peak dirty footprint 1.6GB; hot rows stay cached).
; Override global mmap+mlock which forces all weights into memory, saves the ngram table usage
load-mode = mmap
; Measured best at 6, but not for the reason first recorded here. The old note
; blamed rejected deep drafts wasting a verify batch; the real cause is a Metal
; kernel bound. mul_mv_ext is gated to ne11 <= 8 (ggml-metal-ops.cpp:2494), a
; draft of n submits a verify batch of n+1, and batch 9 costs 139.7ms against
; 61.1ms at batch 8. So 7 is the largest value that stays under the bound, 6 is
; what actually measured best, 7 is untested, and 8 falls off the cliff. The
; ceiling is a kernel artefact, not a property of the model. See QWEN_NEXT.md.
spec-draft-n-max = 6
; f16 KV beats the global q8_0 on this model: +1.6% tg at 4K, +1.7% at 32K, both
; with non-overlapping error bars. Only 12 of 48 layers attend, so the extra cost
; is ~1.5GiB at this ctx-size - cheap here, which is why this is a per-model
; override and the global stays q8_0 for models with dense attention.
cache-type-k = f16
cache-type-v = f16
; #28092's persistent prompt cache: restart prefill 39.7s -> 0.09s, measured on
; this model - and then never wired to it. sync-models.py adds these keys to every
; model it discovers by scanning the source tree, but this one is hand-configured
; here because the merged GGUF lives outside that tree, so it inherited nothing.
; Per model, never in [*]: a router child deletes every entry in the directory
; whose cache key is not its own, so one shared path means loading a second model
; wipes this model's cache. ~900 MiB per 33k-token prompt.
cache-disk       = /Users/samm/.cache/llama.cpp/prompt-cache/Qwen3.8-Flash-Next-MTP-Merged-GGUF
cache-disk-max   = 32768
; GPU-side draft sampling saves a CPU sync per draft step: +6% tg at 4K depth
spec-draft-backend-sampling = 1
; +16% prefill at 32K (570 -> 661 t/s, ub 512 -> 2048), TG unchanged;
; costs ~1.1GiB extra compute buffer.
; With the local 64-offset checkpoint patch applied (see QWEN_NEXT.md) this does
; NOT trade off against cached multi-turn cost: a steady-state agent turn costs
; 74 tokens / ~470ms at both ub 2048 and ub 1024, so 2048 stays. On a STOCK build
; the per-turn replay is one ubatch (2058 tok / 2393ms here) and the trade-off
; comes back - revisit this line if that patch is ever dropped.
ubatch-size = 2048
; batch-size = 4096
tags = UD-IQ4_XS,MTP
ctx-checkpoints  = 32
ctx-size         = 131072
chat-template-file = /Users/samm/git/Qwen-Fixed-Chat-Templates/chat_template.jinja
; Qwen's published sampling for this model in thinking mode. It costs decode: the
; MTP draft is greedy and verification is exact token equality, so every off-argmax
; draw ends the chain. Measured 2026-09-04, NGEN=120 x 3 prompts, machine idle:
;   temp 0   acceptance 0.824  tg 63.1     temp 0.7  acceptance 0.681  tg 56.0
;   temp 0.6 acceptance 0.730  tg 59.6     temp 1.0  acceptance 0.698  tg 55.4
; Dropping to 0.6 is +7.6% tg. Left at 1.0 deliberately - that is a sampling-quality
; call, not a tuning one. 0.7 measures no better than 1.0, so 0.6 is the useful step.
temp             = 1.0
top-k            = 20
min-p            = 0.0
